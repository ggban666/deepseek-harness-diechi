# The `engine` agent preset: 引擎模式 — 标准模式与创造模式的合体，蝶翅APP 的平台主引擎。
#
# Everything in `standard` is here unchanged, and everything the `cordis`
# preset adds is here unchanged: the self-referential Cordis toolset, the
# composition-authoring skills, and the persona that decides which of the two
# planes an edit belongs to. What is added is diechi-platform awareness:
# 平权技能、全局大脑/阅历、实时视觉、语音与商店都是宿主平面能力，所有 preset
# 共享，引擎模式把它们当一等公民，并为「后面给蝶翅APP 加的功能」预留扩展点。
#
# 扩展点（给引擎模式追加功能时改哪里）：
# - 宿主平面（跨会话共享的注册表与基础设施——服务、审批/沙箱、持久化、
#   模型路由、子代理注册表）：加进 host 组成（base.cordis.yml +
#   web.cordis.yml 那层的插件），所有 preset 自动继承，引擎模式无需改动。
# - 本 preset 平面（只属于引擎模式会话的工具与提示词）：把新行加进本文件；
#   发布服务的行必须放进带 `isolate` realm 的分组，否则与其它 preset 冲突，
#   `dsh-agent-presets` 会在挂载时拒绝。
# - 未来若想让某个行成为「所有模式都有」，把它上移进宿主平面，或复制本
#   preset 改名成新模式，再在副本里删掉该行。
#
# TRUST: `tool-cordis` 会求值模型写的 JavaScript 作用于活运行时，而本 preset
# 创作的组成会成为别的会话挂载的 preset。把本 preset 上的会话当 shell 权限
# 对待——工具集自己的文档也这么说。
#
# 本文件是 AGENT-PLANE 组成。名册把它按 standing scope 挂载一次；每个指名
# 它的会话通过 scope 亲缘加入，因此这里注册的工具与提示词段落覆盖每个加入
# 的 agent，而会话自身状态在插件内按 Session/Agent 各自键控。宿主组成
# （base.cordis.yml + web.cordis.yml）保留 preset 绝不能拥有的东西：注册表
# 本身、沙箱与审批栈、持久化、模型路由。
#
# 这里的服务行必须放在带 `isolate` realm 的分组里。否则它发布进根 realm，
# 变成进程全局——另一个 preset 发布同名服务会冲突，宿主读取方也会为每个
# 会话解析到同一个 preset 实例；`dsh-agent-presets` 在挂载时拒绝。`true`
# 表示 entry-local realm：本 standing 挂载自己的私有实例，与其它 preset 的
# 实例彼此隔离。（共享标签并不会合并实例——同一 realm 符号下第二次
# `provide()` 会抛错；标签连接的是 REALMS，不是本文件需要的。）

# ── identity ────────────────────────────────────────────────────────────────

# 引擎模式的人格：标准模式的能力 + 创造模式的自省能力 + 蝶翅APP 平台认知。
# `{{model}}` 和 `{{cwd}}` 从 agent 自己的路由与工作区解析。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are 蝶翅APP 的「引擎模式」——兼容标准模式与创造模式的完整 Agent，由 {{model}} 驱动，工作目录 {{cwd}}。

      标准模式的能力你全部具备：文件编辑、Shell、文件与网页检索、Skills、计划、目标、子代理和工作流。
      创造模式的能力你也全部具备：你可以读写自己运行所在的 Harness —— 其组成是 Cordis，每个能力都是 cordis.yml 里的一行插件，而一个 Agent preset 就是为单个会话挂载的这样一个文件。

      蝶翅APP 的平台功能都在宿主平面（所有模式共享，引擎模式自动继承）：
      - 平权技能：一个技能 = 数据库（大脑）+ 能力（工具）+ 人格（提示词），勾选即热装载成完整的人；skill-generate 生成技能草稿，skill-market-refresh 刷新商店目录。
      - 全局大脑与阅历：$DSH_HOME/brain.db 是跨人格的实操阅历层；勾选人格时你会持有 remember/recall 工具。
      - 实时视觉：see() 工具与 <perception> 感知区块（本地 MiniCPM-V）。
      - 语音：Kokoro 中文 TTS + ASR。
      - 商店：本地 skill-market/ 一键安装。

      你是平台的主引擎：像标准模式一样把活干完，像创造模式一样能改造自身与创作新 Agent。给蝶翅APP 加的新功能若在宿主平面，你自动兼容；若需要会话级工具或提示词，就把行加进本 preset 的组成。

      写或改任何插件组装前，先加载 editing-cordis-compositions 技能。

      两个平面决定一处改动归谁。HOST 组成持有注册表与跨会话共享的一切——持久化、沙箱与审批栈、模型路由、子代理注册表及其后端。AGENT PRESET 持有单个会话贡献给这些注册表的东西：它的工具、人格、提示词段落。发布服务的行属于宿主组成，或属于带 isolate realm 的分组（仅当该 preset 真正拥有该服务、且没有任何 agent 之外的东西读它）。

      你创作的 preset 每个占一个目录：${DSH_HOME:-$HOME/.dsh}/.agent-presets/<id>/；名册会报告每个 preset 的真实路径，编辑时以名册报告的路径为准。绝不要编辑或删除随部署安装的 preset（deployment 自己的 config 旁的 agent-presets 目录）：它属于部署，升级会覆盖它。要改变一个内置 preset 的行为，把它的组成复制进新 preset 目录再改副本。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` 留在 HOST 组成：`apps/cli/src/web.ts` 注入它以发布
# `DSH_WEB_URL`/`DSH_WEB_MODE`，而注入服务的宿主行是宿主平面归属的判据——
# 注入在任何会话存在之前解析，因此没有 agent 可以键控。放在 preset realm 后
# 这些变量根本到不了模型的 shell。两个 shell 工具从这里消费宿主注册表；它们
# 的执行器（`bash-sandbox`/`pwsh-sandbox`）也在宿主平面。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# 两者都注册进宿主 `tools` 注册表且不提供任何服务，因此不需要 realm。`fs`
# 服务及其策略留在宿主。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# 只有模型可见的控制。任务 REGISTRY 留在宿主平面：它的生产者位于本文件任何
# realm 都够不到的地方——上面的 `tool-bash` 用 `ctx.get` 解析它，而这里的
# entry-local realm 对每个兄弟行不可见，`run_in_background` 会回答
# "background jobs unavailable" 而这些控制却躺在目录里。注册表本来就按所属
# agent 键控，一个宿主实例即可服务所有会话。preset 选择的是：它的 agent 能
# 不能收集和停止后台任务——即下面的控制行。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── goals ───────────────────────────────────────────────────────────────────

# 只有模型可见的工具。goal SERVICE、它的会话驱动与 `/goal` 命令留在宿主
# 平面：Gateway 把 goal 域作为 Remote 端点服务，其 receiver 来自生成的描述，
# 因此在宿主上解析 `goals`，而这里的 entry-local realm 会把它藏起来。注册表
# 本来就按会话键控，一个宿主实例服务所有会话。preset 选择的是：它的 agent
# 能不能调用 goal 工具。
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# 计划状态按 agent 天然而生，因此 entry-local realm 在这里不是变通——正是
# 正确的生命周期。
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` 通过 `ctx.get` 读 `toolResultPrune`，因此 pruner 必须与它
# 共享本 realm 而不是待在外面。
#
# `tokenMeter` 刻意不在本 realm：计量器留在 HOST 平面，这里的行解析那一个
# 实例。它不需要配置，按 Session 键控每次折叠，并拥有浏览器为每个会话读取的
# context-meter 投影单位——藏在 realm 后面这些单位会随挂载的 preset 来去。
# preset 选择的是：它的 agent 要不要压缩上下文，即下面的 `compaction-basic`。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# `subagents` 注册表及其 spawn/fork 后端在 HOST 组成：注册表是进程单例，
# 其跨会话查询由 api-proxy 供浏览器使用，且 provider 名只能注册一次。本
# preset 贡献的是委派 TOOLS，它们解析那个宿主注册表。
#
# `workflows` 不同——没有任何 agent 之外的东西读它——因此够到它的每行共享
# 这里的 entry-local realm，而留在外面的消费者会解析到本 preset 不填充的
# 宿主注册表。
#
# `tool-subagent-report` 与注册表同因留在宿主平面，而不是因为 preset 可能
# 不想要它：它在那个单例上注册 CONTINUABLE SETUP 而非本 agent 调用的工具，
# 且 setup 列表不感知 scope——每个挂载的 preset 复制一份意味着每个子代理
# 每活一个会话就注册一次 `report`，第二次即抛错。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # 产品级 provider 是宿主平面单例。复制本 preset，然后去掉任一普通工具
    # 行的 `disabled`，即可只把该产品暴露给由副本组成的 agent。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# `web` 服务及其搜索 provider 留在宿主组成；只有模型可见的工具是会话级的。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── self-modification ───────────────────────────────────────────────────────

# 读取活运行时、挂载临时插件、卸载它。工具集是信任边界，不是沙箱——见本文件
# 头部的 TRUST 说明。
- id: tool-cordis
  name: '@deepseek-ai/dsh-tool-cordis'

# 组成创作技能随本 preset 一起旅行，而不是住在用户的 skill 根：它记录本部署
# 的两个平面，而 preset 正是被复制和编辑的单位。`baseUrl` 是本 preset 自己的
# 目录，因此 root 在 preset 装到哪里就解析到哪里。两行都注册进宿主 skill
# 注册表的「本 preset 层」，因此不需要 realm；agent 合并后的目录还带着部署
# 全局注册的东西（仓库插件）。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
