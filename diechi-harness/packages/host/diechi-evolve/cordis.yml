# dsh bundle: diechi-evolve
# 必须在 @deepseek-ai/dsh-host-diechi-supervisor 之后 mount（依赖 ctx.supervision）。
# 不需要比 skill-store 早——它不直接接触 PersonBrain。
#
# 空数组 `[]` 的含义是「本 bundle 不加载任何插件」，必须显式列出插件行，
# 且新增行要用 `- insert:`（裸 `- id:` 只用于修改已存在的行）。
# 见 diechi-supervisor/cordis.yml 里的同名说明。
- insert:
    - id: diechi-evolve
      name: '@deepseek-ai/dsh-host-diechi-evolve'
