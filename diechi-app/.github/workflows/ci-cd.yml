name: 蝶翅APP CI/CD流水线

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        python-version: ["3.10"]
    
    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4
      
      # 2. 设置Node.js环境
      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: 安装pnpm
        run: npm install -g pnpm
      
      - name: 安装前端依赖
        run: |
          cd apps/web
          pnpm install --frozen-lockfile
      
      # 3. 设置Python环境
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: 安装后端依赖
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      # 4. 运行前端测试
      - name: 运行前端测试
        run: |
          cd apps/web
          pnpm lint
          pnpm format:check
          pnpm type-check
          pnpm test
      
      # 5. 运行后端测试
      - name: 运行后端测试
        run: |
          cd apps/api
          pytest --cov=apps/api --cov-report=xml --cov-fail-under=80
      
      # 6. 上传测试覆盖率
      - name: 上传测试覆盖率到Codecov
        uses: codecov/codecov-action@v3
        with:
          files: apps/api/coverage.xml
          flags: backend
          name: backend-coverage

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4
      
      # 2. 构建Docker镜像
      - name: 构建Docker镜像
        run: |
          docker build -t diechi-app:latest .
          docker images
      
      # 3. 运行安全扫描
      - name: 运行Trivy安全扫描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'diechi-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      # 4. 上传安全扫描结果
      - name: 上传Trivy扫描结果
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      # 1. 部署到生产环境
      - name: 部署到生产环境
        run: echo "🚀 部署到生产环境"
        
      # 2. 通知部署成功
      - name: 部署成功通知
        if: success()
        run: echo "✅ 部署成功"
        
      # 3. 通知部署失败
      - name: 部署失败通知
        if: failure()
        run: echo "❌ 部署失败"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
      # 1. 部署到测试环境
      - name: 部署到测试环境
        run: echo "🧪 部署到测试环境"
        
      # 2. 运行端到端测试
      - name: 运行端到端测试
        run: echo "🔍 运行端到端测试"

# ============================================
# 流水线说明
# ============================================
# - test: 运行所有测试（前端+后端）
# - build: 构建Docker镜像并安全扫描
# - deploy-staging: 部署到测试环境（develop分支）
# - deploy: 部署到生产环境（main分支）

# ============================================
# 触发条件
# ============================================
# - push到develop分支: 运行测试和构建
# - push到main分支: 运行测试、构建和部署
# - pull request到develop: 运行测试

# ============================================
# 环境变量
# ============================================
# - DEEPSEEK_API_KEY: DeepSeek API密钥（GitHub Secrets）
# - DATABASE_URL: 数据库连接字符串（GitHub Secrets）
