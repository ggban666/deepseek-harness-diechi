version: '3.8'

# 蝶翅APP预发布环境Docker Compose配置
# 用于测试和验证生产环境配置
# 包含前端、后端、数据库、缓存等服务

services:
  # ========================================
  # 前端服务 (React + Nginx)
  # ========================================
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: diechi-frontend-staging
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://backend:8000
    volumes:
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./apps/web/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - diechi-network-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # 后端服务 (FastAPI + Python)
  # ========================================
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: diechi-backend-staging
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=staging
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - PORT=8000
      - MODEL_CACHE_DIR=/app/models
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/diechi_staging
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./apps/api/uploads:/app/uploads
      - ./apps/api/temp:/app/temp
      - ./apps/api/static:/app/static
      - ./models:/app/models
      - ./logs/backend-staging:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - diechi-network-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # PostgreSQL数据库 (预发布实例)
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: diechi-postgres-staging
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=diechi_staging
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./data/postgres-staging:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - diechi-network-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Redis缓存 (预发布实例)
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: diechi-redis-staging
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis-staging:/data
    ports:
      - "6380:6379"
    networks:
      - diechi-network-staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

# ============================================
# 网络配置
# ============================================
networks:
  diechi-network-staging:
    driver: bridge
    name: diechi-network-staging

# ============================================
# 部署说明
# ============================================
# 1. 启动预发布环境：
#    docker-compose -f docker-compose.staging.yml up -d
#
# 2. 停止预发布环境：
#    docker-compose -f docker-compose.staging.yml down
#
# 3. 查看日志：
#    docker-compose -f docker-compose.staging.yml logs -f
#
# 4. 运行测试：
#    docker-compose -f docker-compose.staging.yml exec backend pytest
#
# 5. 运行数据库迁移：
#    docker-compose -f docker-compose.staging.yml exec backend alembic upgrade head

# ============================================
# 环境配置
# ============================================
# - 前端: http://localhost:8080
# - 后端: http://localhost:8001
# - 数据库: localhost:5433
# - Redis: localhost:6380

# ============================================
# 测试配置
# ============================================
# - 使用DEBUG日志级别
# - 单节点部署
# - 独立数据库实例
# - 独立缓存实例

# ============================================
# 与生产环境的区别
# ============================================
# ✅ 端口不同 (8080/8001/5433/6380)
# ✅ 数据库名称不同 (diechi_staging)
# ✅ Redis数据库索引不同 (1)
# ✅ 日志级别不同 (DEBUG)
# ❌ 不包含监控服务
# ❌ 不包含消息队列
# ❌ 不包含ELK日志系统

# ============================================
# 清理预发布环境
# ============================================
# docker-compose -f docker-compose.staging.yml down -v
# rm -rf data/postgres-staging data/redis-staging logs/backend-staging
