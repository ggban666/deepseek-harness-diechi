# 蝶翅APP前端Nginx配置
# 生产环境配置，包含Gzip压缩、缓存策略、CORS等

worker_processes auto;
worker_rlimit_nofile 100000;

# 事件配置
events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

# HTTP配置
http {
    # 基础配置
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 日志配置
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_disable "msie6";
    
    # 缓存配置
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m inactive=60m max_size=100m use_temp_path=off;
    
    # 客户端请求限制
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # 服务器配置
    server {
        listen 80;
        server_name localhost;
        
        # 根目录配置
        root /usr/share/nginx/html;
        index index.html;
        
        # 静态文件缓存
        location / {
            try_files $uri $uri/ /index.html;
            
            # 静态文件缓存策略
            if ($request_filename ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$) {
                expires 30d;
                add_header Cache-Control "public, no-transform";
            }
            
            # API代理配置
            location /api {
                proxy_pass ${REACT_APP_API_URL}/api;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # 代理缓存
                proxy_cache my_cache;
                proxy_cache_valid 200 302 10m;
                proxy_cache_valid 404 1m;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            }
            
            # 静态资源服务
            location /static {
                expires 365d;
                add_header Cache-Control "public, immutable";
            }
            
            # WebSocket支持
            location /ws {
                proxy_pass ${REACT_APP_API_URL}/ws;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
            }
        }
        
        # 健康检查端点
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
        
        # 错误页面配置
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # CORS配置
        add_header 'Access-Control-Allow-Origin' '*';  
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE';
        add_header 'Access-Control-Allow-Headers' 'X-Requested-With,content-type';
        add_header 'Access-Control-Allow-Credentials' 'true';
        
        # 请求限制
        limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
        limit_req zone=one burst=20 nodelay;
    }
    
    # 监控配置
    server {
        listen 8080;
        server_name localhost;
        
        location /metrics {
            stub_status;
        }
        
        location /nginx_status {
            stub_status;
        }
    }
}

# ============================================
# Nginx配置说明
# ============================================
# - Gzip压缩：减少传输大小，提高加载速度
# - 缓存策略：静态文件长期缓存，API短期缓存
# - CORS配置：允许跨域请求
# - 请求限制：防止DDoS攻击
# - 健康检查：快速检测服务状态
# - 错误页面：友好的错误提示
# - 监控端点：Nginx性能监控

# ============================================
# 环境变量说明
# ============================================
# REACT_APP_API_URL: 后端API地址 (默认http://localhost:8000)
# 可以通过docker-compose设置环境变量覆盖

# ============================================
# 性能优化建议
# ============================================
# 1. 启用HTTPS：
#    配置SSL证书，启用HTTP/2
#
# 2. 使用CDN：
#    将静态文件部署到CDN
#
# 3. 负载均衡：
#    使用多个Nginx实例
#
# 4. 缓存优化：
#    调整缓存策略和过期时间

# ============================================
# 安全配置建议
# ============================================
# 1. 启用HTTPS：
#    使用Let's Encrypt获取免费SSL证书
#
# 2. 限制访问：
#    配置防火墙规则，限制IP访问
#
# 3. 安全头部：
#    添加安全相关的HTTP头部
#
# 4. 定期更新：
#    定期更新Nginx版本和依赖

# ============================================
# 监控和日志
# ============================================
# - 访问日志：/var/log/nginx/access.log
# - 错误日志：/var/log/nginx/error.log
# - 性能指标：通过8080端口访问/metrics
# - Nginx状态：通过8080端口访问/nginx_status
